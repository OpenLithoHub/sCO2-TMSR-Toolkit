name: Python Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify CoolProp installation
        run: |
          python -c "import CoolProp.CoolProp as CP; print('CoolProp', CP.get_global_param_string('version'))"

      - name: Run pytest with coverage
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-report=term

      - name: Regenerate self-consistency benchmark CSV
        run: python -m src.tools.build_self_consistency_csv

      - name: Validate CoolProp against self-consistency benchmark
        run: |
          python -m src.tools.validate_against_sandia \
            --data validation/experimental_data/coolprop_self_consistency.csv \
            --tolerance 0.01

      - name: Validate CoolProp against SNL benchmark (skipped if empty)
        run: |
          python -m src.tools.validate_against_sandia \
            --data validation/experimental_data/SNL_compressor_data.csv \
            --tolerance 5.0

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  rom-pipeline:
    # Phase 2 ROM optional dependencies (torch / scikit-learn / onnx /
    # onnxruntime). Run on a single Python version to keep CI cheap — the
    # core test job already exercises Python 3.10/3.11/3.12 for the
    # mainline. This job catches regressions in rom/train_rom.py and the
    # tests/test_rom_pipeline.py end-to-end + onnxruntime checks, which
    # the main job skips because requirements-rom.txt is not installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ROM dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-rom.txt

      - name: Run ROM pipeline tests
        run: pytest tests/test_rom_pipeline.py -v
