name: Build & Deploy Jupyter Book

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'src/**'
      - '.github/workflows/build-book.yml'
      - 'requirements.txt'
  pull_request:
    branches: [main]
    paths:
      - 'book/**'
  workflow_dispatch:

# Permissions for GitHub Pages deploy via peaceiris/actions-gh-pages.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Editable install so chapters can `import sco2_property_explorer` etc.
          # without sys.path tricks.
          pip install -e .
          pip install -r requirements.txt
          # Pin Jupyter Book to 1.x — JB 2.x is a from-scratch mystmd rewrite
          # with a different CLI ("jupyter book build" subcommand expects a
          # file, not a directory) that does not yet read this `_config.yml` /
          # `_toc.yml` layout. Track JB 2.x compatibility separately.
          pip install "jupyter-book<2" jupytext "myst-nb<2"

      - name: Build the book
        run: |
          # `--all` rebuilds from scratch; `-W` promotes warnings to errors so
          # a broken chapter (e.g. failing executable cell) fails CI rather
          # than silently shipping a chapter with no rendered output.
          jupyter-book build --all -W book/

      - name: Upload built site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: jupyter-book-html
          path: book/_build/html

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: book/_build/html
