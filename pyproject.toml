[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sco2-tmsr-toolkit"
version = "0.1.0"
description = "Open-source toolkit for supercritical CO2 Brayton cycles coupled to advanced nuclear reactors (TMSR / HTGR)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "OpenLithoHub Contributors" }
]
keywords = ["supercritical CO2", "sCO2", "TMSR", "HTGR", "CoolProp", "nuclear", "Brayton cycle"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "CoolProp>=7.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
test = ["pytest>=7.4", "pytest-cov>=4.1"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "streamlit>=1.30"]

[project.urls]
Homepage = "https://github.com/OpenLithoHub/sCO2-TMSR-Toolkit"
Documentation = "https://github.com/OpenLithoHub/sCO2-TMSR-Toolkit/tree/main/docs"
Repository = "https://github.com/OpenLithoHub/sCO2-TMSR-Toolkit"
Issues = "https://github.com/OpenLithoHub/sCO2-TMSR-Toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
